services:
  storage-init:
    image: ghcr.io/${GITHUB_REPOSITORY:-rdgout/covercraft}:latest
    user: '0:0'
    command: ['init-storage']
    volumes:
      - storage:/app/storage
    network_mode: none
    restart: 'no'
    healthcheck:
      disable: true

  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-rdgout/covercraft}:latest
    ports:
      - '${APP_PORT:-8010}:8000'
    env_file:
      - .env.docker
    environment: &app-environment
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stderr
    volumes:
      - storage:/app/storage
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - covercraft
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/up']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  horizon:
    image: ghcr.io/${GITHUB_REPOSITORY:-rdgout/covercraft}:latest
    command: php artisan horizon
    stop_signal: SIGTERM
    stop_grace_period: 30s
    env_file:
      - .env.docker
    environment: *app-environment
    volumes:
      - storage:/app/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - covercraft
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'php', 'artisan', 'horizon:status']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  scheduler:
    image: ghcr.io/${GITHUB_REPOSITORY:-rdgout/covercraft}:latest
    command: php artisan schedule:work
    env_file:
      - .env.docker
    environment: *app-environment
    healthcheck:
      disable: true
    volumes:
      - storage:/app/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - covercraft
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env.docker
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - covercraft
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis:/data
    networks:
      - covercraft
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
  redis:
  storage:

networks:
  covercraft:
    driver: bridge
